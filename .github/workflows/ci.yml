name: Sightline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and run tests
        run: npm run check

  windows-foundation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Windows foundation
        run: dotnet restore windows/Sightline.Windows.sln
      - name: Build Windows foundation
        run: dotnet build windows/Sightline.Windows.sln -c Release --no-restore
      - name: Test Windows core
        run: dotnet test windows/tests/Sightline.Core.Tests/Sightline.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=sightline-core.trx"
      - name: Test Windows safety layer
        run: dotnet test windows/tests/Sightline.Windows.Tests/Sightline.Windows.Tests.csproj -c Release --no-build --logger "trx;LogFileName=sightline-windows.trx"
      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sightline-windows-test-results-${{ github.sha }}
          path: |
            windows/tests/Sightline.Core.Tests/TestResults/
            windows/tests/Sightline.Windows.Tests/TestResults/
          if-no-files-found: warn
          retention-days: 14

  package-extension:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Sightline extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: sightline-extension-${{ github.sha }}
          path: extension/
          if-no-files-found: error
          retention-days: 14
