name: Sightline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and run tests
        run: npm run check


  package-extension:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Sightline extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: sightline-extension-${{ github.sha }}
          path: extension/
          if-no-files-found: error
          retention-days: 14
