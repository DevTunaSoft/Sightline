<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Yahoo Mail mock inbox</title></head>
<body>
  <header><h1>Yahoo Mail</h1></header>
  <main>
    <form role="search">
      <label for="search">Search mail</label>
      <input id="search" type="text" role="textbox" aria-label="Search mail" />
      <button type="submit">Search</button>
    </form>
    <div class="toolbar">
      <input type="checkbox" aria-label="Select all" />
      <button type="button">Move to Trash</button>
    </div>
    <p class="count">Showing 1-2 of 2</p>
    <ul class="messages">
      <li data-id="m1">Mock message one</li>
      <li data-id="m2">Mock message two</li>
    </ul>
  </main>
</body>
</html>
